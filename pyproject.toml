[project]
name = "ai-gateway"
version = "0.1.0"
description = "Centralized FastAPI gateway for Typst & modern-g7-32 RAG, Decision guards, and Polza AI orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "lancedb>=0.41.0",
    "loguru>=0.7.3",
    "openai>=3.49.0",
    "pydantic>=2.10.0",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.2.0",
    "python-slugify>=9.0.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ai-gateway = "ai_gateway.main:run"
ai-gateway-reindex = "ai_gateway.scripts.reindex:main"
ai-gateway-eval = "ai_gateway.scripts.eval_rag:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

[tool.ruff]
line-length = 99
target-version = "py312"